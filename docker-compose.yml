version: '3.8'

services:
  api:
    build:
      context: .
      args:
        # Baked into the image and surfaced on /health so the freshness canary
        # can see deployment drift, not just data staleness. sync_data.sh sets it.
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: tickertrace-api
    restart: unless-stopped
    ports:
      # Loopback only: Apache (TLS) is the sole client, and it reaches the
      # container from the Docker bridge gateway, which is the only peer the
      # Dockerfile trusts for X-Forwarded-* (--forwarded-allow-ips 172.16.0.0/12).
      # Publishing this on 0.0.0.0 would bypass TLS and Apache.
      - "127.0.0.1:8100:8100"
    volumes:
      # Mount the real data directory so the API reads live CSVs
      - ./etf-dashboard/public/data:/app/etf-dashboard/public/data:ro
      # Persist the SQLite database outside the container
      - ./api/data:/app/api/data
    env_file:
      - api/.env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
