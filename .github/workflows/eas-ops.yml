name: EAS ops (Android)

# Manual EAS chores that need EXPO_TOKEN, which only exists as an Actions secret. `status` is read-only.
# Pattern from tradernetwork/vero's eas-ops.yml. Both submit actions need the Google Play service-account key on EAS
# (mobile/scripts/play/upload-play-submit-key-to-eas.mjs); without it they stop with a clear message first.
on:
  workflow_dispatch:
    inputs:
      op:
        description: "status = list builds/updates; submit-android = latest finished production build to the Play INTERNAL track; release-android-production = new production build from this ref, submitted to the Play PRODUCTION track (Google review still applies)"
        required: true
        type: choice
        options: [status, submit-android, release-android-production]
        default: status

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.13.0
          token: ${{ secrets.EXPO_TOKEN }}

      # eas reads app.config.ts, which resolves config plugins from node_modules.
      - run: npm ci

      - name: Status
        if: inputs.op == 'status'
        run: |
          eas whoami
          eas build:list --platform android --limit 5 --non-interactive
          eas update:list --branch production --limit 5 --non-interactive || true
          eas channel:view production --non-interactive || true
          node scripts/play/check-submit-key.mjs || true

      - name: Check Play submit key
        if: inputs.op != 'status'
        run: node scripts/play/check-submit-key.mjs

      # Newest FINISHED production-profile build, by id, so a preview or development build can never be picked up.
      - name: Submit latest Android production build (internal track)
        if: inputs.op == 'submit-android'
        run: |
          id=$(eas build:list --platform android --build-profile production --status finished --limit 1 --json --non-interactive | jq -r '.[0].id // empty')
          if [ -z "$id" ]; then echo "::error::No finished production Android build to submit. Run the Mobile release workflow first."; exit 1; fi
          echo "build id: $id"
          eas submit --platform android --profile production --id "$id" --non-interactive

      # Builds this exact ref and submits that build by id (the production-release submit profile = Play production track).
      - name: Build and release to Play production
        if: inputs.op == 'release-android-production'
        run: |
          id=$(eas build --platform android --profile production --non-interactive --json | jq -r '.[0].id')
          echo "build id: $id"
          eas submit --platform android --profile production-release --id "$id" --non-interactive
