name: EAS ops (Android)

# Manual EAS chores that need EXPO_TOKEN, which only exists as an Actions secret. `status` is read-only.
# Pattern from tradernetwork/vero's eas-ops.yml. Both submit actions need the Google Play service-account key on EAS
# (mobile/scripts/play/upload-play-submit-key-to-eas.mjs); without it they stop with a clear message first.
# Store submissions go to Play PRODUCTION by default (eas.json submit.production); submit-android-internal is the opt-in internal track.
on:
  workflow_dispatch:
    inputs:
      op:
        description: "status = list builds/updates; submit-android = latest finished production build to the Play PRODUCTION track (Google review applies); submit-android-internal = the same build to the Play INTERNAL testing track only; release-android-production = new production build from this ref, submitted to Play PRODUCTION"
        required: true
        type: choice
        options: [status, submit-android, submit-android-internal, release-android-production]
        default: status

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # the shipped-fingerprint tag
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.13.0
          token: ${{ secrets.EXPO_TOKEN }}

      # eas reads app.config.ts, which resolves config plugins from node_modules.
      - run: npm ci

      - name: Status
        if: inputs.op == 'status'
        run: |
          eas whoami
          eas build:list --platform android --limit 5 --non-interactive
          eas update:list --branch production --limit 5 --non-interactive || true
          eas channel:view production --non-interactive || true
          node scripts/play/check-submit-key.mjs || true

      - name: Check Play submit key
        if: inputs.op != 'status'
        run: node scripts/play/check-submit-key.mjs

      # Newest FINISHED production-profile build, by id, so a preview or development build can never be picked up.
      - name: Submit latest Android production build (${{ inputs.op == 'submit-android-internal' && 'internal' || 'production' }} track)
        if: inputs.op == 'submit-android' || inputs.op == 'submit-android-internal'
        env:
          SUBMIT_PROFILE: ${{ inputs.op == 'submit-android-internal' && 'internal' || 'production' }}
        run: |
          id=$(eas build:list --platform android --build-profile production --status finished --limit 1 --json --non-interactive | jq -r '.[0].id // empty')
          if [ -z "$id" ]; then echo "::error::No finished production Android build to submit. Run the Mobile release workflow first."; exit 1; fi
          echo "build id: $id"
          eas submit --platform android --profile "$SUBMIT_PROFILE" --id "$id" --non-interactive

      # Builds this exact ref and submits it to Play production: local on this runner by default (the EAS Free plan's Android
      # build quota is shared with Vero), or an EAS cloud build when MOBILE_BUILD_MODE=cloud.
      - uses: ./.github/actions/native-build
        if: inputs.op == 'release-android-production'
        with:
          mode: ${{ vars.MOBILE_BUILD_MODE || 'local' }}
          profile: production
