name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: pytest
    runs-on: ubuntu-latest
    # api/auth.py's init_db() (called from the FastAPI lifespan, which
    # TestClient(app) in tests/test_api_contract.py triggers) now needs a real
    # Postgres to connect to — Sep 2026 Railway migration moved it off SQLite.
    # This is a throwaway container scoped to the job, not the real Supabase
    # DB; CI never touches production data.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Scraper deps (needed for tests/test_parser.py to import scrape_avantis)
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # API deps
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          pip install pytest pytest-mock

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Syntax check (catches truncated files / merge artifacts)
        run: |
          python -c "import ast; ast.parse(open('api/server.py').read())"
          python -c "import ast; ast.parse(open('api/auth.py').read())"
          python -c "import ast; ast.parse(open('api/data.py').read())"
          python -c "import ast; ast.parse(open('api/mcp_server.py').read())"
          python -c "import ast; ast.parse(open('scrape_avantis.py').read())"
          echo "All Python files parse cleanly."

  next-build:
    name: next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etf-dashboard
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: etf-dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
