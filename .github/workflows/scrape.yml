name: Daily ETF Holdings Scrape

on:
  schedule:
    # Off-hour minutes reduce GitHub's documented scheduler peak/drop risk.
    - cron: '17 18 * * 1-5'
    # Recovery attempt; both schedules can still be delayed or dropped.
    - cron: '37 20 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

# Serialize primary, backup and manual runs; never cancel a running scrape.
concurrency:
  group: daily-holdings-scrape
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
      snapshot_date: ${{ steps.guard.outputs.snapshot_date }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A queued backup must check current main, not its event-time SHA.
          ref: main
      - name: Check whether today's snapshot is missing
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/scrape_schedule.py

  scrape:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    env:
      SNAPSHOT_DATE: ${{ needs.preflight.outputs.snapshot_date }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper
        run: python scrape_avantis.py

      # Standalone CBOE option-universe diff — no holdings data, stdlib only.
      # Writes cboe_snapshot.json + cboe_history/*.json under public/data/,
      # which the commit step below picks up.
      #
      # Non-fatal: this is a supplementary options-universe scan, NOT the daily
      # holdings. A CBOE outage/403 must never abort the job and block the
      # holdings commit (which froze production on 2026-07-22). The script also
      # exits 0 on fetch failure; continue-on-error is the belt-and-suspenders.
      - name: Run CBOE Options Scanner
        continue-on-error: true
        run: python cboe_scanner.py

      - name: Sync CSV to Dashboard & Archive History
        run: |
          mkdir -p etf-dashboard/public/data/history
          # Copy to latest
          cp normalized_holdings.csv etf-dashboard/public/data/holdings_latest.csv
          # Create dated snapshot
          TODAY="${SNAPSHOT_DATE}"
          cp normalized_holdings.csv etf-dashboard/public/data/history/holdings_${TODAY}.csv
          # Keep only last 30 days of history
          find etf-dashboard/public/data/history -name "holdings_*.csv" -type f -mtime +30 -delete

      # Persist the yfinance price cache between runs so we only fetch the new
      # day's incremental prices instead of redoing the full 1,600-ticker pull
      # every morning. The aggregate output JSON is committed separately.
      - name: Restore yfinance price cache
        id: cache-prices
        uses: actions/cache@v4
        with:
          path: data/signal_performance_prices.json
          key: signal-perf-prices-v1-${{ github.run_id }}
          restore-keys: |
            signal-perf-prices-v1-

      # The backtest is a nice-to-have chart, NOT the daily data itself. A
      # flaky yfinance response must never block committing + deploying fresh
      # holdings, so this step is non-fatal: if it crashes, the job stays green
      # and the commit/deploy steps below (if: success()) still run.
      - name: Refresh signal-vs-price backtest
        continue-on-error: true
        run: |
          mkdir -p data
          python -m api.signal_performance 30

      - name: Save yfinance price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/signal_performance_prices.json
          key: signal-perf-prices-v1-${{ github.run_id }}

      # Regenerate the fund rotation reports (ULTI by theme, ULTY by sector)
      # from the fresh history. Non-fatal: a tracker hiccup must never block the
      # data commit.
      - name: Refresh rotation reports
        continue-on-error: true
        run: python3 scripts/rotation_tracker.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Commit CSVs + the refreshed signal-performance JSON + ULTI rotation
          # report. The yfinance price cache is gitignored — it persists via the
          # actions cache above.
          git add normalized_holdings.csv etf-dashboard/public/data/ analyses/*_rotation.md
          TODAY="${SNAPSHOT_DATE}"
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-update holdings [${TODAY}]"
          # Resilient push (see scripts/push_holdings.sh): main routinely advances
          # during the ~90 min job; the helper stashes scraper by-products, rebases
          # taking our freshly scraped data on conflict, and retries with backoff.
          bash scripts/push_holdings.sh main 5 5

      # Push the freshly-committed CSVs onto the live API box.
      #
      # WHY THIS EXISTS: the Vultr container reads history CSVs from its *own*
      # working tree, which only advanced on a manual `git pull` during a hand
      # deploy. Between deploys the bot kept committing fresh data to the repo
      # while production stayed frozen — the site's "DATA UPDATED" pill silently
      # read ~a week stale even though every scrape was green. This closes that
      # gap: every successful scrape now syncs the box.
      #
      # `git reset --hard origin/main` is deliberate over `git pull` — the VPS
      # tree is routinely dirty (leftover scraper/DB output) and a plain pull
      # aborts with "local changes would be overwritten." reset --hard matches
      # remote exactly and never touches gitignored files (the SQLite DB under
      # api/data/ is untracked, so it survives). The API re-reads CSVs per
      # request (no in-memory cache), so volume-mounted data refreshes without a
      # rebuild; `docker compose up -d` just ensures the container is running.
      #
      # The closing health check doubles as a freeze alarm: if the box is
      # unreachable or the API is down, this step fails loudly instead of
      # letting production drift stale unnoticed. Skips cleanly when the deploy
      # secret isn't configured (forks / PRs).
      - name: Deploy fresh data to Vultr
        if: success()
        env:
          VULTR_SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_USER: ${{ secrets.VULTR_USER }}
          VULTR_PATH: ${{ secrets.VULTR_PATH }}
          VULTR_SSH_PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${VULTR_SSH_KEY:-}" ]; then
            echo "VULTR_SSH_KEY not set — skipping Vultr deploy (data committed to repo only)."
            exit 0
          fi
          PORT="${VULTR_SSH_PORT:-22}"
          PATH_ON_BOX="${VULTR_PATH:-/home/mphinance/TickerTrace}"
          mkdir -p ~/.ssh
          printf '%s\n' "$VULTR_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$VULTR_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$PORT" \
            "${VULTR_USER}@${VULTR_HOST}" \
            "set -e; cd '${PATH_ON_BOX}'; git fetch --quiet origin main; git reset --hard origin/main; docker compose up -d; sleep 3; curl -sf http://localhost:8100/health"
          echo "✅ Vultr synced to origin/main and API healthy."
