name: Daily ETF Holdings Scrape

on:
  schedule:
    # Run at 12:00 UTC (7:00 AM EST) every weekday (Monday-Friday)
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper
        run: python scrape_avantis.py

      # Standalone CBOE option-universe diff — no holdings data, stdlib only.
      # Writes cboe_snapshot.json + cboe_history/*.json under public/data/,
      # which the commit step below picks up.
      #
      # Non-fatal: this is a supplementary options-universe scan, NOT the daily
      # holdings. A CBOE outage/403 must never abort the job and block the
      # holdings commit (which froze production on 2026-07-22). The script also
      # exits 0 on fetch failure; continue-on-error is the belt-and-suspenders.
      - name: Run CBOE Options Scanner
        continue-on-error: true
        run: python cboe_scanner.py

      - name: Sync CSV to Dashboard & Archive History
        run: |
          mkdir -p etf-dashboard/public/data/history
          # Copy to latest
          cp normalized_holdings.csv etf-dashboard/public/data/holdings_latest.csv
          # Create dated snapshot
          TODAY=$(date +%Y-%m-%d)
          cp normalized_holdings.csv etf-dashboard/public/data/history/holdings_${TODAY}.csv
          # Keep only last 30 days of history
          find etf-dashboard/public/data/history -name "holdings_*.csv" -type f -mtime +30 -delete

      # Persist the yfinance price cache between runs so we only fetch the new
      # day's incremental prices instead of redoing the full 1,600-ticker pull
      # every morning. The aggregate output JSON is committed separately.
      - name: Restore yfinance price cache
        id: cache-prices
        uses: actions/cache@v4
        with:
          path: data/signal_performance_prices.json
          key: signal-perf-prices-v1-${{ github.run_id }}
          restore-keys: |
            signal-perf-prices-v1-

      # The backtest is a nice-to-have chart, NOT the daily data itself. A
      # flaky yfinance response must never block committing + deploying fresh
      # holdings, so this step is non-fatal: if it crashes, the job stays green
      # and the commit/deploy steps below (if: success()) still run.
      - name: Refresh signal-vs-price backtest
        continue-on-error: true
        run: |
          mkdir -p data
          python -m api.signal_performance 30

      - name: Save yfinance price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/signal_performance_prices.json
          key: signal-perf-prices-v1-${{ github.run_id }}

      # Regenerate the fund rotation reports (ULTI by theme, ULTY by sector)
      # from the fresh history. Non-fatal: a tracker hiccup must never block the
      # data commit.
      - name: Refresh rotation reports
        continue-on-error: true
        run: python3 scripts/rotation_tracker.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Commit CSVs + the refreshed signal-performance JSON + ULTI rotation
          # report. The yfinance price cache is gitignored — it persists via the
          # actions cache above.
          git add normalized_holdings.csv etf-dashboard/public/data/ analyses/*_rotation.md
          TODAY=$(date +%Y-%m-%d)
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-update holdings [${TODAY}]"
          # Resilient push. The backtest makes this job run ~90 min, so main
          # routinely advances (merged PRs) between checkout and here — a plain
          # push then dies with a non-fast-forward "fetch first" rejection and
          # the whole day's fresh holdings never land (production freezes on
          # yesterday's data). Rebase onto whatever landed and retry. The commit
          # only touches data files (normalized_holdings.csv, public/data/,
          # analyses/*_rotation.md) which no app-code PR edits, so the rebase is
          # always conflict-free.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} rejected — rebasing on origin/main and retrying..."
            git pull --rebase origin main
          done
          echo "::error::Failed to push holdings after 5 attempts."
          exit 1

      # No separate deploy step needed anymore (removed Sep 2026, Railway
      # migration): the API now lives on Railway, connected directly to this
      # repo's `main` branch, and Railway rebuilds + redeploys automatically on
      # every push — including this job's own holdings commit above, since the
      # Dockerfile bakes etf-dashboard/public/data/ into the image. That's what
      # used to require the Vultr SSH step below; a push-triggered rebuild makes
      # a separate "go tell the box" step redundant by construction.
